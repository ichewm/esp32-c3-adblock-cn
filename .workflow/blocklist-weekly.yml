# ========================================================
# 每周自动重建中国区广告规则并发布到 dist 分支
# 依赖: 仓库「管理」→「环境变量设置」配置 PUSH_TOKEN
#       (Gitee 私人令牌, projects 权限; 新建: gitee.com/profile/personal_access_tokens)
# 产物: https://gitee.com/hewmbj/esp32-c3-adblock-cn/raw/dist/blocklist.bin
#       设备固件已内置此 URL, 每 168 小时自动拉取
# 定时: 每周二北京时间 10:00 (Gitee Go cron 六段式: 秒 分 时 日 月 周, 周日=1)
# ========================================================
version: 1.0
name: blocklist-weekly
displayName: '每周重建中国区规则'
triggers:
  schedule:
    - cron: '0 0 10 ? * 3'
stages:
  - stage:
    name: build-stage
    displayName: '构建并发布'
    strategy: fast
    steps:
      - step: build@python
        name: build-publish
        displayName: '构建并发布 blocklist'
        pythonVersion: 3.9
        commands: |
          set -e
          python3 --version
          echo "--- 1/3 下载规则源并构建 ---"
          tools/update_cn_blocklist.sh
          echo "--- 2/3 通过 API 发布到 dist 分支 ---"
          python3 tools/publish_gitee_api.py
          echo "--- 3/3 端到端校验(模拟设备匿名拉取) ---"
          python3 - <<'EOF'
          import urllib.request
          url = 'https://gitee.com/hewmbj/esp32-c3-adblock-cn/raw/dist/blocklist.bin'
          remote = urllib.request.urlopen(url, timeout=120).read()
          local = open('data/blocklist.bin', 'rb').read()
          assert remote == local and len(remote) % 5 == 0, 'raw 校验失败'
          print(f'端到端校验通过: {len(remote)} 字节 / {len(remote)//5} 条')
          EOF
