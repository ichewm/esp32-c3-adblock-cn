name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  firmware:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [c3, esp32dev]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
      - run: pip install -U platformio
      - name: Placeholder secrets (real ones are gitignored; the firmware falls back to the setup portal)
        run: cp src/secrets.example.h src/secrets.h
      - run: pio run -e ${{ matrix.env }}

  blocklist-tool:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Parse hosts, plain and AdGuard-style input
        run: |
          printf '||ads.example.com^\n@@||ok.example.org^\n||ok.example.org^\n0.0.0.0 hosts.example.com\nplain.example.com\n/^regex$/\n' > t.txt
          python3 tools/build_blocklist.py t.bin t.txt
          test "$(stat -c%s t.bin)" -eq 15   # 3 entries x 5 bytes
      - name: Unit tests
        run: python3 -m unittest discover -s tools -p 'test_*.py' -v

  # 预构建二进制无法字节级重现（镜像内嵌构建时间戳），所以 docs/ 的安装器物料
  # 不自动提交回仓库；改为每次 push 都产出一份新鲜物料供直接下载。
  # 仓库里提交的 docs/ 物料由 tools/build_web_installer.sh 手动重建（改固件/分区表后）。
  web-installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
      - run: pip install -U platformio
      - name: Placeholder secrets (real ones are gitignored; the firmware falls back to the setup portal)
        run: cp src/secrets.example.h src/secrets.h
      - name: Build China blocklist into data/ (gitignored, but littlefs.bin must embed it)
        run: tools/update_cn_blocklist.sh
      - name: Rebuild browser-installer assets (docs/)
        run: tools/build_web_installer.sh
      - uses: actions/upload-artifact@v4
        with:
          name: web-installer-docs
          path: docs/
          retention-days: 90
