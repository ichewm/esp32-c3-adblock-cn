name: blocklist-cn

# 每周自动重建中国区规则：
#   1) 下载规则源（海外 runner 直连 GitHub 源，无需镜像）
#   2) 构建哈希库（与本地 tools/update_cn_blocklist.sh 完全一致）
#   3) 用 API 推送到 Gitee 的 dist 分支（设备从这里自动拉取）—— 需要 repo secret:
#      GITEE_PUSH_TOKEN = Gitee 私人令牌（projects 权限）
#      设置一次: gh secret set GITEE_PUSH_TOKEN --repo <你的GH用户名>/esp32-c3-adblock-cn
#   4) 同一份 bin 也发布到 GitHub release 作为海外备份
on:
  schedule:
    - cron: "23 5 * * 1"   # Mondays 05:23 UTC = 北京时间周一 13:23
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build China-first blocklist
        run: tools/update_cn_blocklist.sh
      - name: Sanity checks
        run: |
          size=$(stat -c%s data/blocklist.bin)
          echo "size=$size bytes"
          test $((size % 5)) -eq 0                  # whole 40-bit entries
          test "$size" -gt 600000                   # >120k entries
          test "$size" -le 930000                  # fits the 0xF0000 LittleFS partition
      - name: Push to Gitee dist branch (device auto-update source)
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_PUSH_TOKEN }}
        run: tools/publish_gitee_ci.sh
      - name: End-to-end check (anonymous fetch, exactly what the device does)
        run: |
          python3 - <<'EOF'
          import urllib.request
          url = 'https://gitee.com/hewmbj/esp32-c3-adblock-cn/raw/dist/blocklist.bin'
          remote = urllib.request.urlopen(url, timeout=120).read()
          local = open('data/blocklist.bin', 'rb').read()
          assert remote == local and len(remote) % 5 == 0, 'raw fetch mismatch'
          print(f'端到端校验通过: {len(remote)} 字节 / {len(remote)//5} 条')
          EOF
      - name: Publish to GitHub release (overseas backup)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          entries=$(( $(stat -c%s data/blocklist.bin) / 5 ))
          notes="Auto-built $(date -u +%F) — ${entries} entries (anti-AD + yhosts + EasyList China + StevenBlack base). Pushed to Gitee dist branch."
          if gh release view blocklist-cn >/dev/null 2>&1; then
            gh release edit blocklist-cn --notes "$notes"
          else
            gh release create blocklist-cn --title "Weekly China blocklist" --notes "$notes" --latest=false
          fi
          gh release upload blocklist-cn data/blocklist.bin --clobber
